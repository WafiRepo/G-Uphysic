apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

configurations {
    implementation.exclude group: 'com.google.protobuf', module: 'protobuf-java'
}

android {
    buildFeatures {
        buildConfig = true // Enable BuildConfig generation
    }

    defaultConfig {
        applicationId "de.rwth_aachen.phyphox"
        minSdkVersion 21 // Updated from 19 to 21
        targetSdkVersion rootProject.ext.compileSdkVersion
        compileSdk rootProject.ext.compileSdkVersion

        versionName "2.0.0"
        versionCode 2 //2.0.0-01

        def locales = ['en', 'cs', 'de', 'el', 'es', 'fr', 'hi', 'it', 'ja', 'ka', 'nl', 'pl', 'pt', 'ru', 'sr', 'b+sr+Latn', 'tr', 'vi', 'zh-rCN', 'zh-rTW']
        buildConfigField "String[]", "LOCALE_ARRAY", "new String[]{\""+locales.join("\",\"")+"\"}"
        resourceConfigurations += ['en', 'cs', 'de', 'el', 'es', 'fr', 'hi', 'it', 'ja', 'ka', 'nl', 'pl', 'pt', 'ru', 'sr', 'b+sr+Latn', 'tr', 'vi', 'zh-rCN', 'zh-rTW']

        vectorDrawables {
            useSupportLibrary = true
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        multiDexEnabled true

        vectorDrawables.useSupportLibrary = true

        // Default: backend FastAPI yang di-deploy (override dev: -PLOCAL_API_BASE_URL=http://10.0.2.2:8000/)
        def localApiBaseUrl = project.hasProperty("LOCAL_API_BASE_URL") ? project.property("LOCAL_API_BASE_URL").toString() : "http://140.115.126.90:8000/"
        if (!localApiBaseUrl.endsWith("/")) {
            localApiBaseUrl = localApiBaseUrl + "/"
        }
        buildConfigField "String", "LOCAL_API_BASE_URL", "\"${localApiBaseUrl}\""
    }

    buildTypes {
        release {
            lintOptions {
                disable 'MissingTranslation'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    flavorDimensions = ["permissions"]
    productFlavors {
        screenshot {
            dimension "permissions"
            minSdkVersion 21
        }
        regular {
            dimension "permissions"
            minSdkVersion 21
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
    sourceSets {
        main {
            jniLibs.srcDirs += ['../openCVLibrary310/src/main/jniLibs']
        }
    }

    useLibrary 'org.apache.http.legacy'
    namespace 'de.rwth_aachen.phyphox'
    testNamespace 'de.rwth_aachen.phyphoxTest'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':openCVLibrary310')

    // Android Core Libraries
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.appcompat:appcompat-resources:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // Utility Libraries
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.udojava:EvalEx:2.7'

    // Barcode Scanner
    implementation 'com.journeyapps:zxing-android-embedded:3.5.0'

    // Apache POI
    implementation 'org.apache.poi:poi:3.13'

    // SVG Support
    implementation 'com.caverock:androidsvg:1.4'

    // Firebase Dependencies
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation('com.google.firebase:firebase-auth') {
        exclude group: "com.google.protobuf", module: "protobuf-java"
    }
    implementation("com.google.firebase:firebase-firestore") {
        exclude group: "com.google.protobuf", module: "protobuf-java"
    }
    implementation("com.google.firebase:firebase-storage") {
        exclude group: "com.google.protobuf", module: "protobuf-java"
    }

    // Protobuf
    implementation("com.google.protobuf:protobuf-javalite:3.21.12")

    // Testing Dependencies
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'tools.fastlane:screengrab:2.1.1'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // MQTT Client
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:${rootProject.ext.clientVersion}"
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-maps:17.0.1'
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // JSON & Network
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'mysql:mysql-connector-java:8.0.26'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
        implementation 'com.jsibbold:zoomage:1.3.1'
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'
    implementation 'com.tbuonomo:dotsindicator:4.3'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
}
