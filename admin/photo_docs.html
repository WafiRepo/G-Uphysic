<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Documentation - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .storage-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .photo-preview { width: 100%; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="all_records.html">All Records</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="data_recovery.html">Data Recovery</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white active" href="photo_docs.html">Photo Docs</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <h1 class="h2">Photo Documentation Management</h1>
                
                <!-- Stats Cards -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card storage-card">
                            <div class="card-body">
                                <h5>Total Photos</h5>
                                <h3 id="totalPhotos">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card storage-card">
                            <div class="card-body">
                                <h5>Active Users</h5>
                                <h3 id="activeUsers">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card storage-card">
                            <div class="card-body">
                                <h5>Storage Used</h5>
                                <h3 id="storageUsed">-</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card storage-card">
                            <div class="card-body">
                                <h5>Today's Uploads</h5>
                                <h3 id="todayUploads">-</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Photo List -->
                <div class="card">
                    <div class="card-header">
                        <h5>Photo Documentation</h5>
                    </div>
                    <div class="card-body">
                        <div id="photoList" class="row">
                            <!-- Photos will be loaded here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBF1Oy7vcWztqtcMAQoG_zx2eqQwevXvRg",
            authDomain: "gphysolve.firebaseapp.com",
            projectId: "gphysolve",
            storageBucket: "gphysolve.firebasestorage.app",
            messagingSenderId: "794871328792",
            appId: "1:794871328792:web:2a37ca02c792fc6b83536d",
            measurementId: "G-MNGEX8W1X4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadData() {
            try {
                const recordSnapshot = await db.collection('record').get();
                const questionsSnapshot = await db.collection('questions').get();
                
                let totalPhotos = 0;
                let activeUsers = new Set();
                let todayUploads = 0;
                const today = new Date().toISOString().split('T')[0];

                // Process collections
                [recordSnapshot, questionsSnapshot].forEach(snapshot => {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.photoDocumentation) totalPhotos += data.photoDocumentation.length;
                        if (data.notePhotos) totalPhotos += data.notePhotos.length;
                        if (data.experimentPhotoUrl) totalPhotos++;
                        if (data.idCustomer) activeUsers.add(data.idCustomer);
                        
                        if (data.lastPhotoUpdate) {
                            const uploadDate = new Date(data.lastPhotoUpdate).toISOString().split('T')[0];
                            if (uploadDate === today) todayUploads++;
                        }
                    });
                });

                // Update stats
                document.getElementById('totalPhotos').textContent = totalPhotos;
                document.getElementById('activeUsers').textContent = activeUsers.size;
                document.getElementById('todayUploads').textContent = todayUploads;
                document.getElementById('storageUsed').textContent = (totalPhotos * 2) + ' MB';

                // Load photo list
                loadPhotoList(recordSnapshot, questionsSnapshot);

            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function loadPhotoList(recordSnapshot, questionsSnapshot) {
            const photoList = document.getElementById('photoList');
            photoList.innerHTML = '';

            [recordSnapshot, questionsSnapshot].forEach(snapshot => {
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.photoDocumentation || data.notePhotos || data.experimentPhotoUrl) {
                        const photoCard = createPhotoCard(data, doc.id);
                        photoList.appendChild(photoCard);
                    }
                });
            });
        }

        function createPhotoCard(data, docId) {
            const col = document.createElement('div');
            col.className = 'col-md-4 col-lg-3 mb-3';
            
            let previewUrl = '';
            let photoType = '';
            
            if (data.experimentPhotoUrl) {
                previewUrl = data.experimentPhotoUrl;
                photoType = 'Experiment';
            } else if (data.photoDocumentation && data.photoDocumentation.length > 0) {
                previewUrl = data.photoDocumentation[0];
                photoType = 'Documentation';
            } else if (data.notePhotos && data.notePhotos.length > 0) {
                previewUrl = data.notePhotos[0];
                photoType = 'Note';
            }
            
            if (previewUrl) {
                col.innerHTML = `
                    <div class="card">
                        <img src="${previewUrl}" class="photo-preview" alt="Photo">
                        <div class="card-body">
                            <h6>${data.question || 'No Question'}</h6>
                            <p class="small">${data.desc || 'No Description'}</p>
                            <div class="small text-muted">
                                <p><strong>Type:</strong> ${photoType}</p>
                                <p><strong>User:</strong> ${data.customerName || 'Unknown'}</p>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return col;
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
