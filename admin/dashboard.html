<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - P-MAGIC Physics Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Admin Portal Styles -->
    <link rel="stylesheet" href="admin-styles.css">
    <style>
        .stat-card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,.1);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">P-MAGIC Physics Admin</a>
            <div class="d-flex">
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="col-md-3 col-lg-2 d-md-block sidebar">
        <div class="sidebar-sticky">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="dashboard.html">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="users.html">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="questions.html">
                        <i class="bi bi-question-circle"></i> Questions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="records.html">
                        <i class="bi bi-journal-text"></i> Records
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="fix_existing_users.html">
                        <i class="bi bi-tools"></i> Fix Users
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main content -->
    <main role="main">
        <div class="container-fluid">
            <h1 class="h2 mb-4">Dashboard Overview</h1>

            <!-- Statistics Cards -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card stat-card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Users</h5>
                            <h2 class="card-text" id="totalUsers">Loading...</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Questions</h5>
                            <h2 class="card-text" id="totalQuestions">Loading...</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card stat-card bg-info text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Views</h5>
                            <h2 class="card-text" id="totalViews">Loading...</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Recent Activity</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>User</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="recentActivity">
                                <tr>
                                    <td colspan="3" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZL5oSEVbDLrN2hbZeDXSchr8wDWAW4ok",
            authDomain: "phyphox-34aed.firebaseapp.com",
            projectId: "phyphox-34aed",
            storageBucket: "phyphox-34aed.firebasestorage.app",
            messagingSenderId: "602030706614",
            appId: "1:602030706614:web:f0d8a44a4c4012749b3b17",
            measurementId: "G-M7SKB5YS91"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Check authentication
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
            }
        });

        // Logout function
        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        // Load statistics
        async function loadStatistics() {
            try {
                // Get total users
                const usersSnapshot = await db.collection('user').get(); // Changed from 'users' to 'user'
                document.getElementById('totalUsers').textContent = usersSnapshot.size;

                // Get total questions
                const questionsSnapshot = await db.collection('questions').get();
                document.getElementById('totalQuestions').textContent = questionsSnapshot.size;

                // Calculate total views
                let totalViews = 0;
                questionsSnapshot.forEach(doc => {
                    totalViews += doc.data().views || 0;
                });
                document.getElementById('totalViews').textContent = totalViews;

                // Load recent activity
                const activitySnapshot = await db.collection('activity')
                    .orderBy('timestamp', 'desc')
                    .limit(5)
                    .get();

                const activityHtml = activitySnapshot.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <tr>
                            <td>${new Date(data.timestamp).toLocaleString()}</td>
                            <td>${data.user}</td>
                            <td>${data.action}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('recentActivity').innerHTML = activityHtml || '<tr><td colspan="3" class="text-center">No recent activity</td></tr>';

            } catch (error) {
                console.error('Error loading statistics:', error);
                alert('Error loading statistics. Please check console for details.');
            }
        }

        // Load initial data
        loadStatistics();
    </script>
</body>
</html>
