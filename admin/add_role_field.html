<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Role Field - P-MAGIC Physics Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        .user-item {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
        }
        .user-item.updated {
            background: #d4edda;
            border-color: #c3e6cb;
        }
        .user-item.error {
            background: #f8d7da;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="text-center mb-4">
                <h2 class="mb-4">Add Role Field to Users</h2>
                <p class="text-muted">This utility will add the 'role' field to all users in the 'user' collection.</p>
            </div>

            <!-- Login Section -->
            <div id="loginSection">
                <div class="mb-3">
                    <label for="adminEmail" class="form-label">Admin Email</label>
                    <input type="email" class="form-control" id="adminEmail" placeholder="admin@pmagic.com">
                </div>
                <div class="mb-3">
                    <label for="adminPassword" class="form-label">Admin Password</label>
                    <input type="password" class="form-control" id="adminPassword" placeholder="Enter admin password">
                </div>
                <button class="btn btn-primary" onclick="login()">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </div>

            <!-- User Management Section -->
            <div id="userSection" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4>User List</h4>
                    <div>
                        <button class="btn btn-success me-2" onclick="addRoleToAll()">
                            <i class="bi bi-plus-circle"></i> Add Role to All Users
                        </button>
                        <button class="btn btn-outline-secondary" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </div>
                </div>

                <div id="userList">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <div class="mt-2">Loading users...</div>
                    </div>
                </div>
            </div>

            <!-- Status Messages -->
            <div id="statusMessage" class="alert" style="display: none;"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZL5oSEVbDLrN2hbZeDXSchr8wDWAW4ok",
            authDomain: "phyphox-34aed.firebaseapp.com",
            projectId: "phyphox-34aed",
            storageBucket: "phyphox-34aed.firebasestorage.app",
            messagingSenderId: "602030706614",
            appId: "1:602030706614:web:f0d8a44a4c4012749b3b17",
            measurementId: "G-M7SKB5YS91"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Check if already logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                checkAdminAndLoadUsers();
            }
        });

        // Login function
        async function login() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            if (!email || !password) {
                showStatus('Please enter both email and password', 'danger');
                return;
            }

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                await checkAdminAndLoadUsers();
            } catch (error) {
                showStatus('Login failed: ' + error.message, 'danger');
            }
        }

        // Check admin status and load users
        async function checkAdminAndLoadUsers() {
            try {
                const user = firebase.auth().currentUser;
                if (!user) return;

                const userDoc = await db.collection('user').doc(user.uid).get();
                if (!userDoc.exists || userDoc.data().role !== 'admin') {
                    showStatus('Access denied. Admin privileges required.', 'danger');
                    await firebase.auth().signOut();
                    return;
                }

                // Show user section and load users
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                loadUsers();
            } catch (error) {
                showStatus('Error checking admin status: ' + error.message, 'danger');
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const snapshot = await db.collection('user').get();
                const userList = document.getElementById('userList');
                
                if (snapshot.empty) {
                    userList.innerHTML = '<div class="text-center text-muted">No users found</div>';
                    return;
                }

                const usersHtml = snapshot.docs.map(doc => {
                    const data = doc.data();
                    const hasRole = data.role !== undefined;
                    const roleClass = hasRole ? 'updated' : '';
                    
                    return `
                        <div class="user-item ${roleClass}" id="user-${doc.id}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${data.name || 'N/A'}</strong><br>
                                    <small class="text-muted">${data.email || 'N/A'}</small><br>
                                    <small class="text-muted">ID: ${doc.id}</small>
                                </div>
                                <div class="text-end">
                                    <div class="mb-2">
                                        <span class="badge bg-${hasRole ? 'success' : 'warning'}">
                                            ${hasRole ? 'Has Role' : 'No Role'}
                                        </span>
                                    </div>
                                    ${hasRole ? 
                                        `<small class="text-muted">Role: ${data.role}</small>` :
                                        `<button class="btn btn-sm btn-primary" onclick="addRoleToUser('${doc.id}')">
                                            Add Role
                                        </button>`
                                    }
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                userList.innerHTML = usersHtml;
            } catch (error) {
                showStatus('Error loading users: ' + error.message, 'danger');
            }
        }

        // Add role to specific user
        async function addRoleToUser(userId) {
            try {
                const userDoc = await db.collection('user').doc(userId).get();
                if (!userDoc.exists) {
                    showStatus('User not found', 'danger');
                    return;
                }

                const userData = userDoc.data();
                
                // Determine role based on email
                let role = 'user';
                if (userData.email === 'admin@pmagic.com') {
                    role = 'admin';
                }

                // Update user with role
                await db.collection('user').doc(userId).update({
                    role: role
                });

                // Update UI
                const userElement = document.getElementById(`user-${userId}`);
                userElement.className = 'user-item updated';
                userElement.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${userData.name || 'N/A'}</strong><br>
                            <small class="text-muted">${userData.email || 'N/A'}</small><br>
                            <small class="text-muted">ID: ${userId}</small>
                        </div>
                        <div class="text-end">
                            <div class="mb-2">
                                <span class="badge bg-success">Has Role</span>
                            </div>
                            <small class="text-muted">Role: ${role}</small>
                        </div>
                    </div>
                `;

                showStatus(`Role '${role}' added to ${userData.email}`, 'success');
            } catch (error) {
                showStatus('Error adding role: ' + error.message, 'danger');
            }
        }

        // Add role to all users
        async function addRoleToAll() {
            try {
                const snapshot = await db.collection('user').get();
                let updatedCount = 0;
                let errorCount = 0;

                for (const doc of snapshot.docs) {
                    try {
                        const data = doc.data();
                        
                        // Skip if already has role
                        if (data.role !== undefined) {
                            continue;
                        }

                        // Determine role based on email
                        let role = 'user';
                        if (data.email === 'admin@pmagic.com') {
                            role = 'admin';
                        }

                        // Update user
                        await db.collection('user').doc(doc.id).update({
                            role: role
                        });

                        updatedCount++;
                    } catch (error) {
                        console.error('Error updating user:', doc.id, error);
                        errorCount++;
                    }
                }

                showStatus(`Updated ${updatedCount} users${errorCount > 0 ? `, ${errorCount} errors` : ''}`, 'success');
                loadUsers(); // Reload the list
            } catch (error) {
                showStatus('Error updating users: ' + error.message, 'danger');
            }
        }

        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `alert alert-${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        // Logout function
        function logout() {
            firebase.auth().signOut().then(() => {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('adminEmail').value = '';
                document.getElementById('adminPassword').value = '';
            });
        }
    </script>
</body>
</html>
