<!DOCTYPE html>
<html>
<head>
    <title>Create Admin User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            margin: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create New Admin User</h2>
        <p style="color: #666; margin-bottom: 20px;">
            Create the first admin user for the P-MAGIC Physics Admin Portal.<br>
            After creating admin, you can login at: <a href="index.html" target="_blank">Admin Login</a>
        </p>
        <form id="adminForm" onsubmit="createAdmin(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required placeholder="Enter admin name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Enter admin email">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="Enter password" minlength="6">
            </div>
            <button type="submit">Create Admin User</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZL5oSEVbDLrN2hbZeDXSchr8wDWAW4ok",
            authDomain: "phyphox-34aed.firebaseapp.com",
            projectId: "phyphox-34aed",
            storageBucket: "phyphox-34aed.firebasestorage.app",
            messagingSenderId: "602030706614",
            appId: "1:602030706614:web:f0d8a44a4c4012749b3b17",
            measurementId: "G-M7SKB5YS91"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function showMessage(text, isError = false) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
            messageDiv.style.display = 'block';
        }

        async function createAdmin(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validate input
            if (name.length < 2) {
                showMessage('Name must be at least 2 characters long', true);
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long', true);
                return;
            }

            try {
                showMessage('Creating admin user... Please wait.');
                
                // Create user with email and password
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Add user to Firestore with admin role
                await db.collection('user').doc(user.uid).set({
                    id: user.uid,
                    name: name,
                    email: email,
                    role: 'admin',
                    active: true,
                    totalVisitingIntroduction: 0,
                    totalVisitDurationMillis: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showMessage(`✅ Admin user created successfully!\n\n📧 Email: ${email}\n🔑 Password: ${password}\n\n⚠️ IMPORTANT: Save these credentials and delete this file after use.\n\n🔗 You can now login to admin portal at: users.html`);
                document.getElementById('adminForm').reset();
            } catch (error) {
                console.error('Error:', error);
                let errorMessage = 'Error creating admin: ' + error.message;
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Email already exists. Please use a different email address.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email format. Please enter a valid email address.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use a stronger password (at least 6 characters).';
                }
                
                showMessage(errorMessage, true);
            }
        }
    </script>
</body>
</html>
