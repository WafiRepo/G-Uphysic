<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Documentation - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .photo-card { transition: all 0.3s ease; border-radius: 10px; overflow: hidden; }
        .photo-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .photo-preview { width: 100%; height: 200px; object-fit: cover; }
        .storage-info { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 10px; padding: 20px; }
        .user-storage { background: #f8f9fa; border-radius: 8px; padding: 15px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="all_records.html">
                                <i class="fas fa-database"></i> All Records
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="data_recovery.html">
                                <i class="fas fa-undo"></i> Data Recovery
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white active" href="photo_documentation.html">
                                <i class="fas fa-camera"></i> Photo Documentation
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="fas fa-camera text-primary"></i> Photo Documentation Management
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button class="btn btn-primary" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Storage Overview -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card storage-info">
                            <div class="card-body">
                                <h5 class="card-title">Total Photos</h5>
                                <h3 id="totalPhotos">-</h3>
                                <small>Across all users</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card storage-info">
                            <div class="card-body">
                                <h5 class="card-title">Storage Used</h5>
                                <h3 id="storageUsed">-</h3>
                                <small>Total size</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card storage-info">
                            <div class="card-body">
                                <h5 class="card-title">Active Users</h5>
                                <h3 id="activeUsers">-</h3>
                                <small>With photos</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card storage-info">
                            <div class="card-body">
                                <h5 class="card-title">Today's Uploads</h5>
                                <h3 id="todayUploads">-</h3>
                                <small>New photos</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Storage Breakdown -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-users"></i> User Storage Breakdown</h5>
                    </div>
                    <div class="card-body">
                        <div id="userStorageList">
                            <!-- User storage info will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Photo Documentation List -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-images"></i> Photo Documentation</h5>
                    </div>
                    <div class="card-body">
                        <div id="photoList" class="row">
                            <!-- Photos will be loaded here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBF1Oy7vcWztqtcMAQoG_zx2eqQwevXvRg",
            authDomain: "gphysolve.firebaseapp.com",
            projectId: "gphysolve",
            storageBucket: "gphysolve.firebasestorage.app",
            messagingSenderId: "794871328792",
            appId: "1:794871328792:web:2a37ca02c792fc6b83536d",
            measurementId: "G-MNGEX8W1X4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();

        let currentUser = null;
        let photoData = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadDashboardData();
        });

        function checkAuth() {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    currentUser = user;
                    console.log('User authenticated:', user.email);
                } else {
                    window.location.href = 'login.html';
                }
            });
        }

        async function loadDashboardData() {
            try {
                await Promise.all([
                    loadStorageOverview(),
                    loadUserStorageBreakdown(),
                    loadPhotoDocumentation()
                ]);
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                showAlert('Error loading dashboard data: ' + error.message, 'danger');
            }
        }

        async function loadStorageOverview() {
            try {
                const recordSnapshot = await db.collection('record').get();
                const questionsSnapshot = await db.collection('questions').get();
                
                let totalPhotos = 0;
                let activeUsers = new Set();
                let todayUploads = 0;
                const today = new Date().toISOString().split('T')[0];

                // Process record collection
                recordSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.photoDocumentation) totalPhotos += data.photoDocumentation.length;
                    if (data.notePhotos) totalPhotos += data.notePhotos.length;
                    if (data.experimentPhotoUrl) totalPhotos++;
                    if (data.idCustomer) activeUsers.add(data.idCustomer);
                    
                    if (data.lastPhotoUpdate) {
                        const uploadDate = new Date(data.lastPhotoUpdate).toISOString().split('T')[0];
                        if (uploadDate === today) todayUploads++;
                    }
                });

                // Process questions collection
                questionsSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.photoDocumentation) totalPhotos += data.photoDocumentation.length;
                    if (data.notePhotos) totalPhotos += data.notePhotos.length;
                    if (data.experimentPhotoUrl) totalPhotos++;
                    if (data.idCustomer) activeUsers.add(data.idCustomer);
                    
                    if (data.lastPhotoUpdate) {
                        const uploadDate = new Date(data.lastPhotoUpdate).toISOString().split('T')[0];
                        if (uploadDate === today) todayUploads++;
                    }
                });

                document.getElementById('totalPhotos').textContent = totalPhotos;
                document.getElementById('activeUsers').textContent = activeUsers.size;
                document.getElementById('todayUploads').textContent = todayUploads;
                
                const estimatedStorageMB = totalPhotos * 2;
                document.getElementById('storageUsed').textContent = estimatedStorageMB + ' MB';

            } catch (error) {
                console.error('Error loading storage overview:', error);
            }
        }

        async function loadUserStorageBreakdown() {
            try {
                const userStorageList = document.getElementById('userStorageList');
                userStorageList.innerHTML = '';

                const recordSnapshot = await db.collection('record').get();
                const questionsSnapshot = await db.collection('questions').get();
                
                const userStats = new Map();

                // Process record collection
                recordSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.idCustomer) {
                        if (!userStats.has(data.idCustomer)) {
                            userStats.set(data.idCustomer, {
                                userId: data.idCustomer,
                                userName: data.customerName || 'Unknown',
                                totalPhotos: 0,
                                documentationPhotos: 0,
                                notePhotos: 0,
                                experimentPhotos: 0,
                                lastUpload: null
                            });
                        }
                        
                        const stats = userStats.get(data.idCustomer);
                        if (data.photoDocumentation) stats.documentationPhotos += data.photoDocumentation.length;
                        if (data.notePhotos) stats.notePhotos += data.notePhotos.length;
                        if (data.experimentPhotoUrl) stats.experimentPhotos++;
                        stats.totalPhotos = stats.documentationPhotos + stats.notePhotos + stats.experimentPhotos;
                        
                        if (data.lastPhotoUpdate && (!stats.lastUpload || data.lastPhotoUpdate > stats.lastUpload)) {
                            stats.lastUpload = data.lastPhotoUpdate;
                        }
                    }
                });

                // Process questions collection
                questionsSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.idCustomer) {
                        if (!userStats.has(data.idCustomer)) {
                            userStats.set(data.idCustomer, {
                                userId: data.idCustomer,
                                userName: data.customerName || 'Unknown',
                                totalPhotos: 0,
                                documentationPhotos: 0,
                                notePhotos: 0,
                                experimentPhotos: 0,
                                lastUpload: null
                            });
                        }
                        
                        const stats = userStats.get(data.idCustomer);
                        if (data.photoDocumentation) stats.documentationPhotos += data.photoDocumentation.length;
                        if (data.notePhotos) stats.notePhotos += data.notePhotos.length;
                        if (data.experimentPhotoUrl) stats.experimentPhotos++;
                        stats.totalPhotos = stats.documentationPhotos + stats.notePhotos + stats.experimentPhotos;
                        
                        if (data.lastPhotoUpdate && (!stats.lastUpload || data.lastPhotoUpdate > stats.lastUpload)) {
                            stats.lastUpload = data.lastPhotoUpdate;
                        }
                    }
                });

                // Display user stats
                userStats.forEach(stats => {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user-storage';
                    
                    const lastUploadDate = stats.lastUpload ? new Date(stats.lastUpload).toLocaleDateString() : 'Never';
                    
                    userDiv.innerHTML = `
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <h6>${stats.userName}</h6>
                                <small class="text-muted">ID: ${stats.userId}</small>
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-primary">${stats.totalPhotos} Total</span>
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-info">${stats.documentationPhotos} Doc</span>
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-success">${stats.notePhotos} Notes</span>
                            </div>
                            <div class="col-md-2">
                                <span class="badge bg-warning">${stats.experimentPhotos} Exp</span>
                            </div>
                            <div class="col-md-1">
                                <small class="text-muted">${lastUploadDate}</small>
                            </div>
                        </div>
                    `;
                    
                    userStorageList.appendChild(userDiv);
                });

            } catch (error) {
                console.error('Error loading user storage breakdown:', error);
            }
        }

        async function loadPhotoDocumentation() {
            try {
                const photoList = document.getElementById('photoList');
                photoList.innerHTML = '';

                const recordSnapshot = await db.collection('record').get();
                const questionsSnapshot = await db.collection('questions').get();
                
                photoData = [];

                // Process record collection
                recordSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.photoDocumentation || data.notePhotos || data.experimentPhotoUrl) {
                        photoData.push({
                            id: doc.id,
                            collection: 'record',
                            ...data
                        });
                    }
                });

                // Process questions collection
                questionsSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.photoDocumentation || data.notePhotos || data.experimentPhotoUrl) {
                        photoData.push({
                            id: doc.id,
                            collection: 'questions',
                            ...data
                        });
                    }
                });

                // Display photos
                photoData.forEach(item => {
                    displayPhotoItem(item);
                });

            } catch (error) {
                console.error('Error loading photo documentation:', error);
            }
        }

        function displayPhotoItem(item) {
            const photoList = document.getElementById('photoList');
            
            const photoCard = document.createElement('div');
            photoCard.className = 'col-md-4 col-lg-3 mb-4';
            
            let previewUrl = '';
            let photoType = '';
            
            if (item.experimentPhotoUrl) {
                previewUrl = item.experimentPhotoUrl;
                photoType = 'Experiment';
            } else if (item.photoDocumentation && item.photoDocumentation.length > 0) {
                previewUrl = item.photoDocumentation[0];
                photoType = 'Documentation';
            } else if (item.notePhotos && item.notePhotos.length > 0) {
                previewUrl = item.notePhotos[0];
                photoType = 'Note';
            }
            
            if (previewUrl) {
                photoCard.innerHTML = `
                    <div class="card photo-card">
                        <img src="${previewUrl}" class="photo-preview" alt="Photo preview">
                        <div class="card-body">
                            <h6 class="card-title">${item.question || 'No Question'}</h6>
                            <p class="card-text small">${item.desc || 'No Description'}</p>
                            <div class="small text-muted">
                                <p><strong>Type:</strong> ${photoType}</p>
                                <p><strong>User:</strong> ${item.customerName || 'Unknown'}</p>
                                <p><strong>Date:</strong> ${item.dateTime || 'Unknown'}</p>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-sm btn-primary" onclick="viewPhotoDetails('${item.id}', '${item.collection}')">
                                    <i class="fas fa-eye"></i> View Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                photoList.appendChild(photoCard);
            }
        }

        function viewPhotoDetails(experimentId, collection) {
            showAlert(`Viewing details for experiment: ${experimentId}`, 'info');
        }

        function refreshData() {
            loadDashboardData();
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            const container = document.querySelector('.container-fluid');
            container.insertBefore(alertDiv, container.firstChild);
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
