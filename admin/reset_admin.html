<!DOCTYPE html>
<html>
<head>
    <title>Reset Admin User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        #message {
            margin: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Admin User</h2>
        <p>
            This will:<br>
            1. Reset admin password<br>
            2. Set admin role in Firestore
        </p>
        <button onclick="resetAdmin()">Reset Admin</button>
        <div id="message" style="display: none;"></div>
    </div>

    <!-- Firebase App -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZL5oSEVbDLrN2hbZeDXSchr8wDWAW4ok",
            authDomain: "phyphox-34aed.firebaseapp.com",
            projectId: "phyphox-34aed",
            storageBucket: "phyphox-34aed.firebasestorage.app",
            messagingSenderId: "602030706614",
            appId: "1:602030706614:web:f0d8a44a4c4012749b3b17",
            measurementId: "G-M7SKB5YS91"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        function showMessage(text, isError = false) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
            messageDiv.style.display = 'block';
        }

        async function resetAdmin() {
            try {
                // Send password reset email
                await firebase.auth().sendPasswordResetEmail('admin@pmagic.com');

                // Get user by email
                const userRecord = await firebase.auth().fetchSignInMethodsForEmail('admin@pmagic.com');
                
                if (userRecord.length > 0) {
                    // Sign in anonymously to access Firestore
                    await firebase.auth().signInAnonymously();

                    // Query for user document by email
                    const querySnapshot = await firebase.firestore()
                        .collection('users')
                        .where('email', '==', 'admin@pmagic.com')
                        .get();

                    if (!querySnapshot.empty) {
                        // Update the first matching document
                        const userDoc = querySnapshot.docs[0];
                        await firebase.firestore()
                            .collection('users')
                            .doc(userDoc.id)
                            .update({
                                role: 'admin',
                                active: true,
                                updatedAt: new Date().toISOString()
                            });

                        showMessage(`Success!\n\n1. Password reset email sent to admin@pmagic.com\n2. Admin role set in database\n\nCheck your email to reset password, then try logging in.`);
                    } else {
                        throw new Error('User document not found in Firestore');
                    }
                } else {
                    throw new Error('User not found');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error: ' + error.message, true);
            }
        }
    </script>
</body>
</html>
